name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Prepare example configuration
        run: cp include/secrets.h.example include/secrets.h

      - name: Build firmware (esp32_poe)
        run: pio run -e esp32_poe

      - name: Merge into single flashable binary
        run: |
          BOOT_APP0=$(find ~/.platformio -name boot_app0.bin | head -1)
          esptool.py merge_bin \
            --output firmware-poe2412-${{ github.ref_name }}.bin \
            --chip esp32 \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 16MB \
            0x1000  .pio/build/esp32_poe/bootloader.bin \
            0x8000  .pio/build/esp32_poe/partitions.bin \
            0xe000  "$BOOT_APP0" \
            0x10000 .pio/build/esp32_poe/firmware.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: firmware-poe2412-${{ github.ref_name }}.bin
          generate_release_notes: false
          body: |
            ## Quick Flash

            **Download** `firmware-poe2412-${{ github.ref_name }}.bin` and flash via USB (first flash only):

            ```bash
            pip install esptool
            esptool.py --chip esp32 --port PORT --baud 460800 write_flash 0x0 firmware-poe2412-${{ github.ref_name }}.bin
            ```

            | OS | Port example |
            |----|-------------|
            | Linux | `/dev/ttyUSB0` or `/dev/ttyACM0` |
            | macOS | `/dev/cu.usbserial-*` |
            | Windows | `COM3` (check Device Manager) |

            > After first flash, subsequent updates can be done via OTA using the `ota_poe` environment.

            See **[docs/flashing.md](https://github.com/PeterkoCZ91/POE-2412-security/blob/main/docs/flashing.md)** for wiring diagram, PoE setup, and first-boot instructions.

            ## Build info

            - Environment: `esp32_poe` (LAN8720A RMII Ethernet, PoE)
            - Flash: 16 MB, custom partition scheme
